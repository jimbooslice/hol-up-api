openapi: 3.1.1
info:
  title: Hol Up transit API
  version: 1.3.0
  description: Realtime service from all eight feeds in MTA's Subway Realtime catalog, including Staten Island Railway; immutable route geometry and explicitly labeled inferred train positions.
paths:
  /healthz:
    get:
      summary: Liveness check
      responses:
        '200':
          description: Process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      summary: Realtime data readiness check
      responses:
        '200':
          description: At least one configured realtime source is fresh.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: No configured realtime source is fresh.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /api/v1/routes:
    get:
      summary: List route IDs in the available realtime snapshots
      responses:
        '200':
          description: Active route IDs from every source that has loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Routes'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /api/v1/trains:
    get:
      summary: List compact realtime trains or complete position outcomes for a route
      description: >-
        Omit view to preserve compact selection. The positions view includes every
        route-attributable trip update, including unidentified, canceled, ambiguous,
        and unprojectable records, plus authorized scheduled runs. Standalone
        vehicle entities are outside this view. It captures one schedule/realtime
        bundle and one evaluation time; null coordinates always have a reason.
      parameters:
        - name: route_id
          in: query
          required: true
          description: A route ID returned by /api/v1/routes, such as A or SI.
          schema:
            type: string
          example: W
        - name: view
          in: query
          required: false
          description: Select the complete position outcome contract; omit for the compact response.
          schema:
            type: string
            enum: [positions]
          example: positions
      responses:
        '200':
          description: Realtime trains for the requested route. An empty list is valid only when every relevant source has loaded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Trains'
                  - $ref: '#/components/schemas/Positions'
              examples:
                unavailableGeometry:
                  $ref: '#/components/examples/PositionsWithoutSchedule'
                realtime:
                  $ref: '#/components/examples/RealtimePositions'
                staleSimulation:
                  $ref: '#/components/examples/StaleSchedulePositions'
        '400':
          description: route_id was omitted or view is unsupported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /api/v1/routes/{route_id}/geometry:
    get:
      summary: Canonical stations, route shapes, and ordered service patterns
      description: >-
        Geometry belongs to one immutable schedule version. GeoJSON coordinates
        are longitude then latitude. Stop order belongs to each service pattern,
        including branches and repeated occurrences. Retained ineligible geometry
        remains inspectable. Refetch on a positions schedule_version mismatch.
      parameters:
        - name: route_id
          in: path
          required: true
          schema:
            type: string
          example: A
      responses:
        '200':
          description: Route geometry with schedule eligibility and per-pattern anchor reasons.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteGeometry'
              examples:
                bentRoute:
                  $ref: '#/components/examples/RouteGeometry'
        '404':
          description: The loaded schedule does not contain this route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No schedule has loaded (schedule_unavailable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /metrics:
    get:
      summary: Prometheus-compatible aggregate and per-feed realtime metrics
      responses:
        '200':
          description: Metrics in Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
  /openapi.yaml:
    get:
      summary: This OpenAPI document
      responses:
        '200':
          description: The API contract in YAML.
          content:
            application/yaml:
              schema:
                type: string
components:
  responses:
    SourceUnavailable:
      description: A source required to answer the request has not loaded yet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SourceError'
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    Readiness:
      type: object
      required: [status, freshness, coverage, sources]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        freshness:
          $ref: '#/components/schemas/Freshness'
        coverage:
          $ref: '#/components/schemas/Coverage'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
    Routes:
      type: object
      required: [as_of, freshness, coverage, sources, routes]
      properties:
        as_of:
          $ref: '#/components/schemas/Timestamp'
        freshness:
          $ref: '#/components/schemas/Freshness'
        coverage:
          $ref: '#/components/schemas/Coverage'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        routes:
          type: array
          items:
            type: string
          example: ['1', '2', A, B, G, L, N, SI]
    Trains:
      type: object
      required: [as_of, freshness, coverage, sources, trains]
      properties:
        as_of:
          $ref: '#/components/schemas/Timestamp'
        freshness:
          $ref: '#/components/schemas/Freshness'
        coverage:
          $ref: '#/components/schemas/Coverage'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        trains:
          type: array
          items:
            $ref: '#/components/schemas/Train'
    Train:
      description: Compact trip view with an identified next served stop. CANCELED, DELETED, and trips without an identified route or served stop remain in normalized state but are excluded here.
      type: object
      required:
        - entity_id
        - route_id
        - trip_id
        - service_date
        - start_time
        - direction_id
        - direction
        - next_stop_id
        - next_stop_sequence
        - predicted_at
        - prediction_delay_seconds
        - position_basis
        - movement_state
        - freshness
        - source_timestamp
        - source_name
        - received_at
        - trip_update_timestamp
        - trip_update_freshness
        - vehicle_entity_id
        - vehicle_timestamp
        - vehicle_freshness
        - vehicle_match
      properties:
        entity_id:
          type: string
        route_id:
          type: string
        trip_id:
          type: string
        service_date:
          type: string
          description: Service date in YYYYMMDD format.
        start_time:
          type: string
          description: Trip instance start time, empty when omitted upstream.
        direction_id:
          type: [integer, 'null']
          minimum: 0
        direction:
          type: string
          enum: [northbound, eastbound, southbound, westbound, unknown]
        next_stop_id:
          type: string
        next_stop_sequence:
          type: integer
          minimum: 0
        predicted_at:
          $ref: '#/components/schemas/Timestamp'
        prediction_delay_seconds:
          type: [integer, 'null']
          description: Event delay, falling back to an explicit trip delay. Null when absent or NO_DATA; zero means explicitly on time.
        position_basis:
          type: string
          enum: [realtime_prediction, schedule_fallback]
        movement_state:
          type: string
          description: Unknown unless a uniquely matched vehicle observation and its feed are fresh. Trip observation age is reported independently.
          enum: [inferred_moving, reported_stopped, unknown]
        freshness:
          $ref: '#/components/schemas/Freshness'
          description: Freshness of the source feed; consult trip_update_freshness and vehicle_freshness for individual observations.
        source_timestamp:
          $ref: '#/components/schemas/Timestamp'
        source_name:
          type: string
          description: Stable configured feed name that supplied this trip update.
        received_at:
          $ref: '#/components/schemas/Timestamp'
        trip_update_timestamp:
          $ref: '#/components/schemas/Timestamp'
          description: Upstream trip observation time; null when absent or out of range.
        trip_update_freshness:
          $ref: '#/components/schemas/Freshness'
          description: Age of the trip observation, capped by feed freshness. Missing or future observation times are unavailable.
        vehicle_entity_id:
          type: string
          description: Matched vehicle source entity ID, empty without a unique match.
        vehicle_timestamp:
          $ref: '#/components/schemas/Timestamp'
          description: Matched vehicle observation time; null when absent or out of range.
        vehicle_freshness:
          $ref: '#/components/schemas/Freshness'
          description: Age of the matched vehicle observation, capped by feed freshness. Missing or future observation times are unavailable.
        vehicle_match:
          type: string
          enum: [matched, unmatched, ambiguous]
    Source:
      type: object
      required: [name, routes, source_timestamp, freshness]
      properties:
        name:
          type: string
          description: Stable configured feed name.
          enum: [ace, bdfm, g, jz, l, nqrw, numbered, si]
        routes:
          type: array
          description: Route IDs configured as owned by this source, independent of currently active trains.
          items:
            type: string
        source_timestamp:
          $ref: '#/components/schemas/Timestamp'
        freshness:
          $ref: '#/components/schemas/Freshness'
    Coverage:
      type: string
      description: Whether all, some, or none of the sources relevant to this request have loaded a snapshot.
      enum: [complete, partial, unavailable]
    Freshness:
      type: string
      enum: [fresh, stale, unavailable]
    Timestamp:
      type: [string, 'null']
      format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    SourceError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [coverage, sources]
          properties:
            coverage:
              $ref: '#/components/schemas/Coverage'
            sources:
              type: array
              items:
                $ref: '#/components/schemas/Source'
    RouteGeometry:
      type: object
      required:
      - schedule_version
      - schedule_eligible
      - schedule_source
      - schedule_validated_at
      - schedule_age_seconds
      - route_id
      - short_name
      - long_name
      - stations
      - shapes
      - patterns
      properties:
        schedule_version: &id006
          type: &id003
          - string
          - 'null'
          description: Immutable source/parser-schema/archive identity; null without a schedule.
        schedule_eligible: &id007
          type: boolean
        schedule_source: &id008
          type: string
          enum:
          - supplemented
          - regular
          - ''
        schedule_validated_at: &id009
          $ref: '#/components/schemas/Timestamp'
        schedule_age_seconds: &id005
          type:
          - number
          - 'null'
        route_id: &id001
          type: string
        short_name: *id001
        long_name: *id001
        stations:
          type: array
          items:
            $ref: '#/components/schemas/StationFeature'
        shapes:
          type: array
          items:
            $ref: '#/components/schemas/ShapeFeature'
        patterns:
          type: array
          items:
            $ref: '#/components/schemas/ServicePattern'
    PointGeometry:
      type: object
      required:
      - type
      - coordinates
      properties:
        type:
          const: Point
        coordinates: &id002
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
          description: Longitude then latitude.
    LineGeometry:
      type: object
      required:
      - type
      - coordinates
      properties:
        type:
          const: LineString
        coordinates:
          type: array
          items: *id002
          minItems: 2
    StationFeature:
      type: object
      required:
      - type
      - id
      - geometry
      - properties
      properties:
        type:
          const: Feature
        id: *id001
        geometry:
          oneOf:
          - $ref: '#/components/schemas/PointGeometry'
          - type: 'null'
        properties:
          type: object
          required:
          - name
          - reason
          properties:
            name: *id001
            reason: &id004
              type: *id003
    ShapeFeature:
      type: object
      required:
      - type
      - id
      - geometry
      - properties
      properties:
        type:
          const: Feature
        id: *id001
        geometry:
          oneOf:
          - $ref: '#/components/schemas/LineGeometry'
          - type: 'null'
        properties:
          type: object
          required:
          - usable
          - reason
          properties:
            usable:
              type: boolean
            reason: *id004
    StopOccurrence:
      type: object
      required:
      - stop_id
      - station_id
      - stop_sequence
      - distance_meters
      - association
      - reason
      properties:
        stop_id: *id001
        station_id: *id001
        stop_sequence:
          type: integer
          minimum: 0
        distance_meters: *id005
        association: *id001
        reason: *id004
    ServicePattern:
      type: object
      required:
      - service_pattern_id
      - route_id
      - shape_id
      - direction_id
      - stops
      - reason
      properties:
        service_pattern_id: *id001
        route_id: *id001
        shape_id: *id004
        direction_id:
          type:
          - integer
          - 'null'
          enum:
          - 0
          - 1
          - null
        stops:
          type: array
          items:
            $ref: '#/components/schemas/StopOccurrence'
        reason: *id004
      description: Pattern identity excludes timetable times; ordered occurrences preserve platform IDs and
        canonical station IDs.
    Positions:
      type: object
      required:
      - schedule_version
      - schedule_eligible
      - schedule_source
      - schedule_validated_at
      - schedule_age_seconds
      - as_of
      - projected_at
      - bundle_evaluated_at
      - freshness
      - coverage
      - sources
      - trains
      properties:
        schedule_version: *id006
        schedule_eligible: *id007
        schedule_source: *id008
        schedule_validated_at: *id009
        schedule_age_seconds: *id005
        as_of:
          $ref: '#/components/schemas/Timestamp'
        projected_at:
          $ref: '#/components/schemas/Timestamp'
        bundle_evaluated_at:
          $ref: '#/components/schemas/Timestamp'
        freshness:
          $ref: '#/components/schemas/Freshness'
        coverage:
          $ref: '#/components/schemas/Coverage'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        trains:
          type: array
          items:
            $ref: '#/components/schemas/Position'
      description: One captured bundle and evaluation time. Stale matched runs and absent runs simulate only
        when reconciliation authorizes them from eligible schedule and retained complete metadata. Cancellations/uncertainty
        remain vetoes. Retained replacement windows suppress absent runs after departure and freshness expiry.
        Simulations stop at scheduled final arrival or schedule expiry; readiness is unchanged.
    Position:
      type: object
      required:
      - route_id
      - direction
      - direction_id
      - trip_id
      - service_date
      - trip_instance_id
      - realtime_trip_id
      - realtime_service_date
      - source_record_id
      - source_name
      - entity_id
      - source_index
      - vehicle_entity_id
      - vehicle_match
      - shape_id
      - service_pattern_id
      - schedule_version
      - latitude
      - longitude
      - projected_at
      - position_basis
      - movement_state
      - source_timestamp
      - source_age_seconds
      - received_at
      - trip_update_timestamp
      - trip_update_timestamp_present
      - trip_update_freshness
      - vehicle_timestamp
      - vehicle_timestamp_present
      - vehicle_freshness
      - freshness
      - observation_time
      - observation_age_seconds
      - observation_basis
      - schedule_validated_at
      - schedule_age_seconds
      - interpolation_method
      - reconciliation_outcome
      - reconciliation_reason
      - fallback_reason
      - no_position_reason
      properties:
        route_id: *id001
        direction:
          type: string
          enum:
          - northbound
          - eastbound
          - southbound
          - westbound
          - unknown
        direction_id:
          type:
          - integer
          - 'null'
          enum:
          - 0
          - 1
          - null
        trip_id:
          type: *id003
          description: Static trip ID only when uniquely reconciled; unlike the compact view, this is not
            the realtime trip ID.
        service_date:
          type: *id003
          description: Scheduled service date in YYYYMMDD format.
        trip_instance_id:
          type: *id003
          description: Base64url encoding of the JSON tuple [static trip ID, service date], stable across
            polls and realtime/simulation transitions; absent for uncertain identity.
        realtime_trip_id: *id001
        realtime_service_date:
          type: string
          description: Original realtime service date, retained independently of nullable scheduled identity.
        source_record_id:
          type: *id003
          description: Distinct source/entity/index record identifier. Never use it as a guessed scheduled
            identity. Null for an added scheduled outcome.
        source_name: *id001
        entity_id: *id001
        source_index:
          type: integer
        vehicle_entity_id: *id001
        vehicle_match:
          type: string
          enum:
          - matched
          - unmatched
          - ambiguous
        shape_id: *id004
        service_pattern_id: *id004
        schedule_version: *id004
        latitude:
          type:
          - number
          - 'null'
          minimum: -90
          maximum: 90
        longitude:
          type:
          - number
          - 'null'
          minimum: -180
          maximum: 180
        projected_at:
          $ref: '#/components/schemas/Timestamp'
        position_basis:
          type: string
          enum:
          - realtime_prediction
          - schedule_fallback
          description: Inference basis, never GPS-observed. Stale matched simulations retain run identity
            and realtime provenance.
        movement_state:
          type: string
          enum:
          - inferred_moving
          - reported_stopped
          - unknown
          description: Only fresh unique vehicle evidence establishes reported_stopped; simulation always
            uses unknown.
        source_timestamp:
          $ref: '#/components/schemas/Timestamp'
        source_age_seconds: *id005
        received_at:
          $ref: '#/components/schemas/Timestamp'
        trip_update_timestamp:
          $ref: '#/components/schemas/Timestamp'
        trip_update_timestamp_present:
          type: boolean
        trip_update_freshness:
          $ref: '#/components/schemas/Freshness'
          description: Effective prediction freshness. An absent trip timestamp may use feed-header age, explicitly identified by observation_basis.
        vehicle_timestamp:
          $ref: '#/components/schemas/Timestamp'
        vehicle_timestamp_present:
          type: boolean
        vehicle_freshness:
          $ref: '#/components/schemas/Freshness'
        freshness:
          $ref: '#/components/schemas/Freshness'
          description: Feed freshness independently of projection success or schedule age.
        observation_time:
          $ref: '#/components/schemas/Timestamp'
        observation_age_seconds: *id005
        observation_basis:
          type: string
          description: Identifies observation timing, including feed_header when the optional trip timestamp
            was absent; malformed/future timestamps cannot use that absence rule.
        schedule_validated_at:
          $ref: '#/components/schemas/Timestamp'
        schedule_age_seconds: *id005
        interpolation_method:
          type: string
          description: Explicit interpolation method, including next_prediction_schedule_duration for a preceding
            departure estimated from scheduled segment duration.
        reconciliation_outcome:
          type: string
          enum:
          - matched
          - unmatched
          - invalid
          - ambiguous
          - unavailable
        reconciliation_reason: *id001
        fallback_reason: *id004
        no_position_reason:
          type: *id003
          description: Non-null whenever latitude/longitude are null. Cancellation/identity/authority failures
            precede geometry and timing failures.
      description: One retained realtime record or an authorized scheduled run. Both coordinates are present
        or both null. Fresh geometry/timing failure stays null. No extrapolation beyond supported timing intervals.
        Clients restart interpolation on missing/null outcomes, ambiguity, changed trip/path/direction/geometry,
        or transitions between realtime and simulation; no server track history or nearest-position joins.
  examples:
    RouteGeometry:
      summary: "Synthetic bent A-line geometry (distances illustrative)."
      value: {
        "schedule_version": "supplemented:2:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
        "schedule_eligible": true,
        "schedule_source": "supplemented",
        "schedule_validated_at": "2026-09-13T04:09:00Z",
