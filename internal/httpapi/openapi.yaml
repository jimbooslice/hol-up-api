                ],
                [
                  -74,
                  40.8
                ],
                [
                  -74,
                  40.7
                ]
              ]
            },
            "properties": {
              "usable": true,
              "reason": null
            }
          }
        ],
        "patterns": [
          {
            "service_pattern_id": "example-pattern",
