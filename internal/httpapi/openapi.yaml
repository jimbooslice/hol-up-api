                "association": "shape_dist_traveled",
                "reason": null
              },
              {
                "stop_id": "A03S",
                "station_id": "A03",
                "stop_sequence": 2,
                "distance_meters": 19537,
                "association": "shape_dist_traveled",
                "reason": null
              }
            ],
