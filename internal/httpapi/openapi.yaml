    PositionsWithoutSchedule:
      summary: "A retained trip update with explicit null coordinates while the schedule is unavailable."
      value: {
        "schedule_version": null,
        "schedule_eligible": false,
        "schedule_source": "",
        "schedule_validated_at": null,
